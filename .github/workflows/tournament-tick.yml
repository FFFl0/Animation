# Turns the tournament week over on time.
#
# The tournament function opens a week and closes its bracket the moment
# somebody asks it for the state — which, without this, is whenever the
# first player next opens the screen. The two notices it sends ("sign-ups
# are open", "the tournament has started") are about moments in time, so
# they are worth being punctual about.
#
# Needs three repository secrets, two of which the deploy workflow already
# uses. Without them the job skips and the lazy path still works:
#   SUPABASE_PROJECT_REF    the project ref — the function's address is
#                           built from it
#   SUPABASE_ANON_KEY       the project's anon key, which gets past the
#                           platform's own token check. It ships inside the
#                           app anyway, so it is public by design.
#   TOURNAMENT_TICK_SECRET  any long random string, the same one the
#                           project holds as a function secret — the deploy
#                           workflow writes it there from this same secret.
name: Tournament tick

on:
  schedule:
    # Every quarter of an hour. GitHub treats this as a hint rather than a
    # promise, which is accurate enough for a weekly event.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Poke the tournament function
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TICK_SECRET: ${{ secrets.TOURNAMENT_TICK_SECRET }}
        run: |
          missing=""
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$ANON_KEY" ] && missing="$missing SUPABASE_ANON_KEY"
          [ -z "$TICK_SECRET" ] && missing="$missing TOURNAMENT_TICK_SECRET"
          if [ -n "$missing" ]; then
            echo "Not set:$missing — nothing to call, the function turns the week lazily instead."
            exit 0
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "https://$PROJECT_REF.supabase.co/functions/v1/tournament" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "apikey: $ANON_KEY" \
            -H "x-tournament-tick: $TICK_SECRET" \
            -H 'Content-Type: application/json' \
            -d '{"action":"tick"}')
          cat response.json
          echo
          # A secret that no longer matches, or a function that is not
          # deployed, should fail loudly rather than quietly never firing.
          if [ "$code" != "200" ]; then
            echo "tournament tick failed with HTTP $code"
            exit 1
          fi
