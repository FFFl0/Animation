# Deploys Edge Functions to the Supabase project.
#
# The functions live in supabase/functions and are not part of the app
# build: a new one, or a change to an existing one, reaches the project
# only when it is deployed. This runs that from CI, so the access token
# lives in the repository's secrets and nowhere else.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   a personal access token from
#                           https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    the project ref, the subdomain of its URL
#
# Optional, and worth having if the tournament notices should arrive on
# time rather than when somebody next opens the screen:
#   TOURNAMENT_TICK_SECRET  set here too, and the same value is written to
#                           the project's function secrets below, so the
#                           scheduled poke and the function agree.
#
# Optional, for reports to arrive in Telegram (see BUILD.md, "Жалобы в
# Telegram"); both are copied into the project's function secrets:
#   TELEGRAM_BOT_TOKEN      the bot's token from @BotFather
#   TELEGRAM_CHAT_ID        who the bot writes to
name: Deploy functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Which functions to deploy, space separated'
        required: true
        # All of them by default. Deploying one that has not changed costs
        # a few seconds and nothing else, whereas leaving one behind is
        # invisible until a screen asks it for something it has never
        # heard of — which is exactly how the "Прошлый" tab spent a week
        # insisting there had never been a tournament.
        default: 'tournament send-push shop yookassa-webhook report-notify'
        type: string
      telegram_test:
        description: 'Send a test message to the Telegram chat for reports'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FUNCTIONS: ${{ inputs.functions }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF have to be set as repository secrets."
            exit 1
          fi
          for fn in $FUNCTIONS; do
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "There is no supabase/functions/$fn in this repository."
              exit 1
            fi
            # --yes because a runner has no terminal to confirm at, and the
            # CLI will not touch a hosted project without being told so.
            # The payment webhook is called by YooKassa, which has no
            # Supabase session to present; every other function checks the
            # caller itself and keeps the platform's token check on.
            if [ "$fn" = "yookassa-webhook" ]; then
              supabase functions deploy "$fn" --remote="$PROJECT_REF" --use-api --no-verify-jwt --yes
            else
              supabase functions deploy "$fn" --remote="$PROJECT_REF" --use-api --yes
            fi
          done

      # Checked inside the step rather than in `if`, where the secrets
      # context is not available.
      - name: Keep the tournament tick secret in step with this repository
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TICK_SECRET: ${{ secrets.TOURNAMENT_TICK_SECRET }}
        run: |
          if [ -z "$TICK_SECRET" ]; then
            echo "No TOURNAMENT_TICK_SECRET in this repository — leaving the project's own secrets alone."
            exit 0
          fi
          supabase secrets set "TOURNAMENT_TICK_SECRET=$TICK_SECRET" --remote="$PROJECT_REF" --yes

      # The bot token never enters the app or the database: it lives here
      # and in the project's function secrets, nowhere else.
      - name: Keep the Telegram secrets for reports in step with this repository
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "No TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID in this repository — reports stay in the database only."
            exit 0
          fi
          supabase secrets set "TELEGRAM_BOT_TOKEN=$BOT_TOKEN" "TELEGRAM_CHAT_ID=$CHAT_ID" --remote="$PROJECT_REF" --yes

      - name: Send a Telegram test message
        if: ${{ inputs.telegram_test }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID have to be set as repository secrets first."
            exit 1
          fi
          # Telegram's answer says exactly what is wrong — a bad token, or a
          # chat the bot may not write to because nobody pressed Start.
          answer=$(curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=✅ AnimeQuiz: уведомления о жалобах настроены. Новые жалобы будут приходить сюда.")
          echo "$answer" | grep -q '"ok":true' && { echo "Sent."; exit 0; }
          echo "::error::Telegram refused: $(echo "$answer" | sed 's/.*"description":"\([^"]*\)".*/\1/')"
          exit 1

