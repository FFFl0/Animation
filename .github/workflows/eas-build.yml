name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - simulator

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link EAS project (idempotent)
        run: npx eas-cli init --non-interactive --force

      - name: Build
        run: |
          npx eas-cli build \
            --platform ${{ github.event.inputs.platform }} \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive --json > build-output.json

      - name: Publish download links to job summary
        if: always()
        run: |
          echo "## Build result" >> "$GITHUB_STEP_SUMMARY"
          if [ -s build-output.json ]; then
            node -e "
              const fs = require('fs');
              const parsed = JSON.parse(fs.readFileSync('build-output.json', 'utf8'));
              // --platform all returns one entry per platform, a single
              // platform may return a bare object.
              const builds = Array.isArray(parsed) ? parsed : [parsed];
              const write = (line) => fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + '\n');
              if (builds.length === 0) {
                write('\nNo build info captured — check the log above.');
              }
              for (const b of builds) {
                const platform = (b.platform || '?').toLowerCase();
                const url = b.artifacts && b.artifacts.buildUrl;
                if (url) {
                  write('\n**' + platform + ' ready:** [Download](' + url + ')');
                } else {
                  write('\n**' + platform + '** — status: ' + b.status + '. See the log above or your expo.dev dashboard.');
                }
              }
            "
          else
            echo "Build output was empty — check the log above for the error." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-output
          path: build-output.json
          if-no-files-found: ignore
