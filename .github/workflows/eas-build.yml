name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - simulator

jobs:
  build:
    # One job per platform instead of one `--platform all` command: iOS needs
    # Apple credentials that only exist once somebody has run `eas credentials`
    # interactively, and a single command fails the Android build along with
    # it. fail-fast off so one platform's problem stays that platform's.
    strategy:
      fail-fast: false
      matrix:
        platform: >-
          ${{ github.event.inputs.platform == 'all'
              && fromJSON('["android","ios"]')
              || fromJSON(format('["{0}"]', github.event.inputs.platform)) }}

    name: build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link EAS project (idempotent)
        run: npx eas-cli init --non-interactive --force

      - name: Build
        run: |
          npx eas-cli build \
            --platform ${{ matrix.platform }} \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive --json > build-output.json

      - name: Publish download link to job summary
        if: always()
        run: |
          echo "## ${{ matrix.platform }} — ${{ github.event.inputs.profile }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -s build-output.json ]; then
            node -e "
              const fs = require('fs');
              const parsed = JSON.parse(fs.readFileSync('build-output.json', 'utf8'));
              const b = Array.isArray(parsed) ? parsed[0] : parsed;
              const write = (line) => fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + '\n');
              const url = b && b.artifacts && b.artifacts.buildUrl;
              if (url) write('\n**Ready:** [Download](' + url + ')');
              else if (b) write('\nStatus: ' + b.status + '. See the log above or your expo.dev dashboard.');
              else write('\nNo build info captured — check the log above.');
            "
          else
            echo "Build output was empty — check the log above for the error." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-output-${{ matrix.platform }}
          path: build-output.json
          if-no-files-found: ignore
